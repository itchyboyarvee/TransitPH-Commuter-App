plugins {
    id "com.android.application"
}

def configuredApiBase = project.findProperty("TRANSITPH_API_BASE_URL") ?: ""

android {
    namespace "com.transitph.mobile"
    compileSdk 35

    defaultConfig {
        applicationId "com.transitph.mobile"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "API_BASE_URL", "\"${configuredApiBase}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
}